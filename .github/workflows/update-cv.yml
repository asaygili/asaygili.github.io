name: CV Verilerini Güncelle

on:
  workflow_dispatch:         # Sadece manuel tetikleme

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.12'

      - name: Bağımlılıkları yükle
        run: pip install requests

      - name: Verileri çek
        run: python scripts/fetch_cv.py

      - name: Değişiklik varsa commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "chore: CV verileri otomatik güncellendi $(date '+%d.%m.%Y')"
          git push
